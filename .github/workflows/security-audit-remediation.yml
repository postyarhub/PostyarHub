name: Security audit remediation

on:
  pull_request:
    branches: [main]
    paths:
      - 'postelrobbal/app/**'
      - 'postelrobbal/frontend/**'
      - 'postelrobbal/wordpress-plugin/**'
      - '.github/workflows/security-audit-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: postelrobbal/app/package-lock.json
      - name: Install dependencies
        working-directory: postelrobbal/app
        run: npm ci
      - name: Dependency vulnerability inventory (report only)
        working-directory: postelrobbal/app
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/postyar-app-npm-audit.json" || true
          node - "$RUNNER_TEMP/postyar-app-npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('APP_AUDIT_TOTALS', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const titles = (item.via ?? []).filter((via) => via && typeof via === 'object').map((via) => via.title || via.name || 'advisory');
            console.log('APP_AUDIT_ITEM', JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: [...new Set(titles)].join('; ').slice(0, 600),
            }));
          }
          NODE
      - name: Typecheck
        working-directory: postelrobbal/app
        run: npm run typecheck
      - name: Unit tests
        working-directory: postelrobbal/app
        run: npm test
      - name: Compile backend
        working-directory: postelrobbal/app
        run: npm run build

  wordpress-plugin:
    name: WordPress connector PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check connector PHP syntax
        shell: bash
        run: |
          if command -v php >/dev/null 2>&1; then
            php -l postelrobbal/wordpress-plugin/postyar-wordpress/includes/class-postyar-api.php
          else
            echo 'PHP CLI unavailable on runner; syntax check skipped.'
          fi

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: postelrobbal/frontend/package-lock.json
      - name: Install dependencies
        working-directory: postelrobbal/frontend
        run: npm ci
      - name: Dependency vulnerability inventory (report only)
        working-directory: postelrobbal/frontend
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/postyar-frontend-npm-audit.json" || true
          node - "$RUNNER_TEMP/postyar-frontend-npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('FRONTEND_AUDIT_TOTALS', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const titles = (item.via ?? []).filter((via) => via && typeof via === 'object').map((via) => via.title || via.name || 'advisory');
            console.log('FRONTEND_AUDIT_ITEM', JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: [...new Set(titles)].join('; ').slice(0, 600),
            }));
          }
          NODE
      - name: Build
        working-directory: postelrobbal/frontend
        run: npm run build
