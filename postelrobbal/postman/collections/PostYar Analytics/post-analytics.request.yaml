$kind: http-request
method: GET
url: '{{base_url}}/analytics/posts/:post_id?days=30'
order: 3000
headers:
  - key: Accept
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
pathVariables:
  - key: post_id
    value: 'REPLACE_WITH_POST_ID'
